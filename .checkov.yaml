block-list-secret-scan: []
branch: main
directory:
  - modules/
  - examples/
download-external-modules: false
evaluate-variables: true
framework:
  - terraform
quiet: false
skip-check:
  # CKV_GCP_62: Internal firewall allows all protocols within RFC1918 ranges.
  # This is intentional for internal VPC communication; external access is blocked.
  - CKV_GCP_62
  # CKV_GCP_28: Ensure GCP subnet has a private IP google access.
  # FALSE POSITIVE: Checkov static analysis cannot resolve variable defaults 
  # inside dynamic for_each loops. The variable 'subnet_private_access' defaults to true.
  - CKV_GCP_28
soft-fail: false
